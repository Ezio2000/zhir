[workspace]
members = ["crates/*", "conformance"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
zhir = { path = "crates/zhir", version = "=0.2.0", default-features = false }
zhir-policies = { path = "crates/zhir-policies", version = "=0.2.0" }
zhir-core = { path = "crates/zhir-core", version = "=0.2.0" }
zhir-kernel = { path = "crates/zhir-kernel", version = "=0.2.0" }
zhir-tools = { path = "crates/zhir-tools", version = "=0.2.0" }
zhir-builtins = { path = "crates/zhir-builtins", version = "=0.2.0", default-features = false }
zhir-models = { path = "crates/zhir-models", version = "=0.2.0", default-features = false }
zhir-storage = { path = "crates/zhir-storage", version = "=0.2.0", default-features = false }
zhir-testing = { path = "crates/zhir-testing" }
schemars = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
jsonschema = { version = "0.56", default-features = false }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls"] }
redis = { version = "0.32", default-features = false, features = ["tokio-comp", "script"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
