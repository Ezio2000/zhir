name: Rust
on:
  push:
    branches: [main]
  pull_request:

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo check -p zhir-core --no-default-features --locked
      - run: cargo check -p zhir-policies --no-default-features --locked
      - run: cargo check -p zhir-builtins --no-default-features --features agent --locked
      - run: cargo check -p zhir-builtins --no-default-features --features agent-runtime --locked
      - run: cargo check -p zhir-testing --no-default-features --locked
      - run: cargo check -p zhir-testing --no-default-features --features http --locked
      - run: cargo test -p zhir-testing --no-default-features --features openai-responses --test models_replay --locked
      - run: cargo check -p zhir-models --no-default-features --features minimax --locked
      - run: cargo test -p zhir-testing --no-default-features --features minimax --test minimax_tts --locked
      - run: cargo run -p zhir-conformance --bin zhir-conformance --locked
      - run: cargo run -p zhir-conformance --bin schemas --locked -- --check
      - run: cargo run -p zhir --no-default-features --example custom_tool --features models,typed-tools
      - run: cargo test -p zhir-testing --no-default-features --features models,typed-tools,memory --test developer_api
      - run: cargo test -p zhir-testing --no-default-features --features models,typed-tools,memory --test consumer_ten
      - run: cargo test -p zhir-testing --no-default-features --features models,typed-tools,memory --test core_boundaries
      - run: cargo test -p zhir-testing --no-default-features --features models,typed-tools,typed-output,memory --test convenience
      - run: cargo run -p zhir --example resume --features models,interaction,memory
      - run: cargo check -p zhir --no-default-features --example minimax_tts --features minimax,memory --locked
      - run: uv run conformance/package.py --all-features
  features:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature: [default, policies, tools, typed-tools, typed-output, models, filesystem, shell, interaction, agent, agent-runtime, openai-chat, openai-responses, anthropic, minimax, memory, sqlite, mysql, redis, resources-filesystem]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Check standalone feature
        env:
          FEATURE: ${{ matrix.feature }}
        run: |
          if [ "$FEATURE" = default ]; then
            cargo check -p zhir --no-default-features --locked
          else
            cargo check -p zhir --no-default-features --features "$FEATURE" --locked
          fi
  stores:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: zhir-test
          MYSQL_DATABASE: zhir_test
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pzhir-test"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      ZHIR_TEST_MYSQL_URL: mysql://root:zhir-test@127.0.0.1:3306/zhir_test
      ZHIR_TEST_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p zhir-testing --all-features --test storage_stores -- --ignored
