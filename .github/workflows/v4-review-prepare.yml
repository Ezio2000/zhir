name: Prepare v4 review fixes
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
concurrency:
  group: v4-review-prepare-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.head_ref == 'fix/model-session-v4-review-followup' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: astral-sh/setup-uv@v6
      - name: Apply assertion-checked review fixes
        run: |
          uv run --no-project .github/v4-review/prepare.py
          uv run --no-project - <<'PY'
          from pathlib import Path
          p = Path('crates/zhir-models/src/session.rs')
          text = p.read_text()
          old = '} else if let Some(finish) = &mut finishing {\n                    Some(finish.next())\n                } else {\n                    None\n                }'
          assert text.count(old) == 1
          p.write_text(text.replace(old, '} else {\n                    finishing.as_mut().map(FinishEvents::next)\n                }'))
          p = Path('docs/architecture.md')
          p.write_text(p.read_text() + '''

          ## Binding and completion invariants

          `ModelBinding` records stable adapter selection independently of a remote
          `RecoveryRef`. The kernel persists the bound sender identity before consuming
          session events and supplies it when rebuilding an idle local projection.
          Fallback unwraps each binding layer and reopens only the original candidate;
          reordering, temporary availability changes or missing candidates cannot cause
          silent reselection. Transparent sender decorators forward the binding.

          Response-capable sessions cannot complete over an older input position, whether
          generation is explicit or automatic. Acknowledging Append is not a claim that
          its input has been answered. Kernel advancement and checkpoint validation both
          require current response coverage. Protocols without response events continue
          to use their real closure boundary, not a fabricated response or idle timeout.

          Ordinary exchanges use one scheduler to poll active generation, bounded pending
          emissions, command admission and cancellation/deadlines. Command handlers do
          not await public output capacity. Sequence allocation is serialized with event
          delivery; terminal settlement uses an independent port and drains admitted
          events before returning an error once. No second kernel or execution path is
          introduced.
          '''.replace('\n          ', '\n'))
          PY
      - name: Format and regenerate current schemas
        run: |
          cargo fmt --all
          cargo run -p zhir-conformance --bin schemas --locked
          git diff --check
      - name: Verify formatting and lints
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Verify review regressions and storage integration
        run: |
          set +e
          cargo test -p zhir-testing --all-features --locked --test v4_review -- --nocapture
          review_status=$?
          cargo test -p zhir-testing --all-features --locked --test storage_stores memory -- --exact --nocapture
          storage_status=$?
          if test "$storage_status" -ne 0; then
            binary=$(find target/debug/deps -maxdepth 1 -type f -name 'storage_stores-*' -executable | head -n 1)
            gdb --batch -ex 'set pagination off' -ex 'handle SIGSEGV stop print nopass' -ex 'run memory --exact --nocapture' -ex 'bt 40' --args "$binary"
          fi
          test "$review_status" -eq 0 && test "$storage_status" -eq 0
      - name: Verify workspace tests and contracts
        run: |
          cargo test --workspace --all-features --locked
          cargo run -p zhir-conformance --bin zhir-conformance --locked
          cargo run -p zhir-conformance --bin schemas --locked -- --check
      - name: Commit verified source changes to the repair branch only
        env:
          REPAIR_BRANCH: fix/model-session-v4-review-followup
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin "refs/heads/$REPAIR_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates contracts conformance docs .github/v4-review
          git commit -m 'fix: complete v4 session semantics, binding recovery and regression coverage'
          git push origin "HEAD:refs/heads/$REPAIR_BRANCH"
          echo "Verified commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
