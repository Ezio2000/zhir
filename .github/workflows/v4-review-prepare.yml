name: Prepare v4 review fixes
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
concurrency:
  group: v4-review-prepare-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.head_ref == 'fix/model-session-v4-review-followup' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: astral-sh/setup-uv@v6
      - name: Apply assertion-checked review fixes
        run: |
          uv run --no-project .github/v4-review/prepare.py
          uv run --no-project - <<'PY'
          from pathlib import Path
          p = Path('crates/zhir-models/src/session.rs')
          text = p.read_text()
          old = '} else if let Some(finish) = &mut finishing {\n                    Some(finish.next())\n                } else {\n                    None\n                }'
          assert text.count(old) == 1
          p.write_text(text.replace(old, '} else {\n                    finishing.as_mut().map(FinishEvents::next)\n                }'))
          p = Path('crates/zhir-core/src/run/history.rs')
          text = p.read_text()
          replacements = [
              ('calls: im::OrdMap<CallRef, RuntimeToolCall>,', '// Keep persistent B-tree nodes small: removal/rebalancing moves node arrays.\n    calls: im::OrdMap<Arc<CallRef>, Arc<RuntimeToolCall>>,', 1),
              ('completed: im::OrdSet<CallRef>,', 'completed: im::OrdSet<Arc<CallRef>>,', 1),
              ('delegations: im::OrdSet<CallRef>,', 'delegations: im::OrdSet<Arc<CallRef>>,', 1),
              ('self.delegations.insert(origin);', 'self.delegations.insert(Arc::new(origin));', 1),
              ('self.calls.insert(origin, call.clone());', 'self.calls.insert(Arc::new(origin), Arc::new(call.clone()));', 1),
              ('self.completed.insert(origin.clone());', 'self.completed.insert(Arc::new(origin.clone()));', 2),
              ('self.order.delegations.iter()', 'self.order.delegations.iter().map(|origin| origin.as_ref())', 1),
              ('self.order.calls.iter()', 'self.order.calls.iter().map(|(origin, call)| (origin.as_ref(), call.as_ref()))', 1),
          ]
          for old, new, count in replacements:
              assert text.count(old) == count, old
              text = text.replace(old, new)
          p.write_text(text)
          p = Path('crates/zhir-testing/tests/v4_review.rs')
          text = p.read_text()
          old = 'let mut invocation = runtime.start(RunRequest::new([Message::user("A")]).mode(mode)).unwrap();'
          assert text.count(old) == 1
          text = text.replace(old, '''// Task seals user admission at creation, but host context is still admissible.
                  let late_input = if mode == RunMode::Task { Message::external("B") } else { Message::user("B") };
                  ''' + old)
          old = 'invocation.control().input(Message::user("B"), "test").await.unwrap();'
          assert text.count(old) == 1
          text = text.replace(old, 'invocation.control().input(late_input, "test").await.unwrap();')
          p.write_text(text + '''

          #[test]
          fn persistent_call_index_settles_on_a_small_stack_without_mutating_snapshots() {
              std::thread::Builder::new()
                  .name("bounded-history-stack".into())
                  .stack_size(512 * 1024)
                  .spawn(|| {
                      use zhir_core::{
                          operation::{CallRef, OperationOutcome},
                          run::History,
                          tool::{RuntimeToolCall, RuntimeToolInput},
                      };
                      let calls = (0..256).map(|index| {
                          let id = format!("call-{index}");
                          HistoryEntry {
                              id: id.clone(),
                              origin: Some(CallRef {
                                  session_id: "s".into(), item_id: id.clone(),
                                  generation_id: Some("g".into()), caller_id: "model".into(),
                                  call_id: id.clone(),
                              }),
                              message: Message::Assistant {
                                  output: vec![Output::RuntimeToolCall {
                                      call: RuntimeToolCall {
                                          id, name: "tool".into(),
                                          input: RuntimeToolInput::Structured(json!({"argument":"value"})),
                                      },
                                  }],
                                  provider_data: Value::Null,
                              },
                          }
                      }).collect();
                      let original = History::from_entries(calls).unwrap();
                      let digest = original.digest();
                      let pending: Vec<_> = original.pending_calls()
                          .map(|(origin, call)| (origin.clone(), call.id.clone())).collect();
                      let mut settled = original.clone();
                      for (origin, id) in pending.into_iter().rev() {
                          settled = settled.append(vec![HistoryEntry {
                              id: format!("result:{id}"), origin: Some(origin),
                              message: Message::RuntimeTool {
                                  call_id: id, name: "tool".into(),
                                  outcome: OperationOutcome::Success {
                                      content: vec![], structured: Value::Null,
                                  },
                              },
                          }]).unwrap();
                      }
                      original.validate().unwrap();
                      settled.validate().unwrap();
                      assert_eq!(original.digest(), digest);
                      assert_eq!(original.pending_calls().count(), 256);
                      assert_eq!(settled.pending_calls().count(), 0);
                      assert_eq!(settled.len(), 512);
                  }).unwrap().join().unwrap();
          }
          '''.replace('\n          ', '\n'))
          p = Path('docs/architecture.md')
          p.write_text(p.read_text() + '''

          ## Binding and completion invariants

          `ModelBinding` records stable adapter selection independently of a remote
          `RecoveryRef`. The kernel persists the bound sender identity before consuming
          session events and supplies it when rebuilding an idle local projection.
          Fallback unwraps each binding layer and reopens only the original candidate;
          reordering, temporary availability changes or missing candidates cannot cause
          silent reselection. Transparent sender decorators forward the binding.

          Response-capable sessions cannot complete over an older input position, whether
          generation is explicit or automatic. Acknowledging Append is not a claim that
          its input has been answered. Kernel advancement and checkpoint validation both
          require current response coverage. Protocols without response events continue
          to use their real closure boundary, not a fabricated response or idle timeout.

          Ordinary exchanges use one scheduler to poll active generation, bounded pending
          emissions, command admission and cancellation/deadlines. Command handlers do
          not await public output capacity. Sequence allocation is serialized with event
          delivery; terminal settlement uses an independent port and drains admitted
          events before returning an error once. No second kernel or execution path is
          introduced.

          Persistent history indexes share immutable call identities and values through
          Arc references, keeping B-tree node rebalancing stack-bounded during bulk
          operation settlement. Public history references and snapshot semantics do not
          change; regression coverage also exercises a 512 KiB worker stack.
          '''.replace('\n          ', '\n'))
          PY
      - name: Format and regenerate current schemas
        run: |
          cargo fmt --all
          cargo run -p zhir-conformance --bin schemas --locked
          git diff --check
      - name: Verify formatting and lints
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Verify review regressions and storage integration
        run: |
          set +e
          cargo test -p zhir-testing --all-features --locked --test v4_review -- --nocapture
          review_status=$?
          cargo test -p zhir-testing --all-features --locked --test storage_stores memory -- --exact --nocapture
          storage_status=$?
          if test "$storage_status" -ne 0; then
            sudo apt-get update -qq
            sudo apt-get install -y gdb
            binary=$(find target/debug/deps -maxdepth 1 -type f -name 'storage_stores-*' -executable | head -n 1)
            gdb --batch -ex 'set pagination off' -ex 'handle SIGSEGV stop print nopass' -ex 'run memory --exact --nocapture' -ex 'bt 40' --args "$binary"
          fi
          test "$review_status" -eq 0 && test "$storage_status" -eq 0
      - name: Verify workspace tests and contracts
        run: |
          cargo test --workspace --all-features --locked
          cargo run -p zhir-conformance --bin zhir-conformance --locked
          cargo run -p zhir-conformance --bin schemas --locked -- --check
      - name: Commit verified source changes to the repair branch only
        env:
          REPAIR_BRANCH: fix/model-session-v4-review-followup
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin "refs/heads/$REPAIR_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates contracts conformance docs .github/v4-review
          git commit -m 'fix: complete v4 session semantics, binding recovery and regression coverage'
          git push origin "HEAD:refs/heads/$REPAIR_BRANCH"
          echo "Verified commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
