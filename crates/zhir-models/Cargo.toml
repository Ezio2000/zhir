[package]
include = ["src/**", "examples/**", "Cargo.toml", "README.md", "LICENSE"]
name = "zhir-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP and WebSocket model protocol adapters for zhir"

[lints]
workspace = true

[dependencies]
zhir-core.workspace = true
zhir-policies.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
sha2.workspace = true
tokio.workspace = true
reqwest = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio-tungstenite = { version = "0.30", optional = true, features = ["rustls-tls-native-roots"] }

[features]
minimax = ["dep:tokio-tungstenite", "dep:futures"]
default = []
openai-chat = ["dep:reqwest", "dep:futures"]
openai-responses = ["dep:reqwest", "dep:futures"]
anthropic = ["dep:reqwest", "dep:futures"]
