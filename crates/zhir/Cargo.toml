[package]
include = ["src/**", "examples/**", "Cargo.toml", "README.md", "LICENSE"]
name = "zhir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Composable Rust Agent SDK"

[lints]
workspace = true

[dependencies]
zhir-core.workspace = true
zhir-policies = { workspace = true, optional = true }
zhir-kernel.workspace = true
zhir-tools = { workspace = true, optional = true }
zhir-builtins = { workspace = true, optional = true }
zhir-models = { workspace = true, optional = true }
zhir-storage = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
thiserror.workspace = true
schemars = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }

[features]
openai-live = ["models", "zhir-models/openai-live"]
minimax = ["models", "zhir-models/minimax"]
default = []
typed-output = ["dep:schemars", "dep:jsonschema"]
policies = ["dep:zhir-policies"]
tools = ["dep:zhir-tools", "policies"]
typed-tools = ["tools", "zhir-tools/typed"]
models = ["dep:zhir-models", "policies"]
filesystem = ["tools", "dep:zhir-builtins", "zhir-builtins/filesystem"]
shell = ["tools", "dep:zhir-builtins", "zhir-builtins/shell"]
interaction = ["tools", "dep:zhir-builtins", "zhir-builtins/interaction"]
agent = ["tools", "dep:zhir-builtins", "zhir-builtins/agent"]
agent-runtime = ["agent", "zhir-builtins/agent-runtime"]
openai-chat = ["models", "zhir-models/openai-chat"]
openai-responses = ["models", "zhir-models/openai-responses"]
anthropic = ["models", "zhir-models/anthropic"]
memory = ["dep:zhir-storage"]
resources-filesystem = ["dep:zhir-storage", "zhir-storage/resources-filesystem"]
sqlite = ["dep:zhir-storage", "zhir-storage/sqlite"]
mysql = ["dep:zhir-storage", "zhir-storage/mysql"]
redis = ["dep:zhir-storage", "zhir-storage/redis"]

[dev-dependencies]
tokio.workspace = true
schemars.workspace = true

[[example]]
name = "chat"
required-features = ["openai-chat", "sqlite"]

[[example]]
name = "custom_tool"
required-features = ["typed-tools", "models"]

[[example]]
name = "resume"
required-features = ["models", "interaction", "memory"]

[[example]]
name = "minimax_tts"
required-features = ["minimax", "memory"]

[[example]]
name = "gpt_live"
required-features = ["openai-live", "memory"]
